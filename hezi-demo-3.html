const invv=()=>`<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="card" style="width:min(420px,100%);text-align:center"><span class="mark">${t("app")}</span><h3 style="margin:16px 0 6px">${t("invT")}</h3><p style="color:var(--mut)">${t("invP")}</p><div id="iq" style="display:inline-block;background:#fff;padding:12px;border-radius:16px;margin:12px 0"></div><div class="hint" style="border-style:solid"><small>${t("codeP")}</small><div class="price" style="font-size:24px;direction:ltr">${S.inv}</div><small>${t("invF")}</small></div><button class="btn" style="width:100%;margin-top:16px" onclick="S.inv=null;S.reg=true;render()">${t("invGo")}</button><p style="color:var(--mut);font-size:13px;margin:14px 0 4px">${t("invG")}</p><p style="margin:0 0 8px"><a href="#" style="color:var(--ac);font-weight:600" onclick="gOv();return false">${t("guide")}</a></p><p>${langBtn()}</p></div></div>`
async function redeem(){const c=$("ac").value.trim();if(!c)return toast(t("codeBad"));const r=await SBC.rpc("redeem_code",{p_code:c});if(r.error)return toast(/used/.test(r.error.message)?t("codeUsed"):t("codeBad"));await loadSub();toast(t("codeOk"));render()}
async function doLogin(){if(CLOUD&&S.mode==="stylist"){const c=$("u").value.trim().toLowerCase(),id=$("p").value.trim().toUpperCase(),r=await SBC.rpc("stylist_load",{c,sid:id});if(!r.data)return toast(t("bad"));return sEnter(r.data,c,id)}
if(!CLOUD||S.mode!=="owner")return doLogin0();
const em=$("em").value.trim(),p=$("p").value,u=S.reg?$("u").value.trim():"",reg=S.reg;if(!em||p.length<6||(reg&&!u))return toast(t("bad"));
const r=reg?await SBC.auth.signUp({email:em,password:p}):await SBC.auth.signInWithPassword({email:em,password:p});
if(r.error)return toast(/invalid login/i.test(r.error.message)?(S.lang==="fa"?"ایمیل یا رمز عبور اشتباه است":"Incorrect email or password"):r.error.message);if(!r.data.session)return toast(t("chk"));uid=r.data.user.id;S.reg=false;await enter(reg,u)}
async function out(){if(CLOUD){clearTimeout(tmr);if(sc)await spush();else await push();await SBC.auth.signOut()}uid=null;sc=null;try{localStorage.removeItem("biznext10");localStorage.removeItem("hz_s")}catch(e){}S.theme="rose";S.salon={name:"",nameEn:"",plan:null,logo:null};S.user=null;S.me=null;render()}
const lapsed=()=>!!(S.user&&CLOUD&&!S.salon.paid&&!(S.salon.trialEnd>Date.now())),dl=()=>Math.max(0,Math.ceil((S.salon.trialEnd-Date.now())/864e5));
const lapse=()=>`<div style="min-height:100vh;display:grid;place-items:center;padding:20px"><div class="card" style="width:min(460px,100%);text-align:center"><span class="mark">${t("app")}</span><h3 style="margin:18px 0 8px">${S.salon.trialEnd?t("lapsT"):t("needT")}</h3><p style="color:var(--mut)">${S.salon.trialEnd?t("lapsB"):t("needCode")}</p>${S.user==="owner"&&!S.salon.trialEnd?`<input id="ac" placeholder="${t("codeP")}" style="text-align:center;direction:ltr"><button class="btn" style="width:100%;margin:10px 0 18px" onclick="redeem()">${t("redeem")}</button>`:""}<a class="btn" style="display:inline-block;text-decoration:none" href="#" onclick="sup('buy');return false">${t("buy")}</a><br><br><button class="btn g" onclick="out()">${t("out")}</button></div></div>`;
const trialBar=()=>S.user==="owner"&&S.salon.trialEnd&&!S.salon.paid?`<div class="card" style="margin-bottom:16px;padding:12px 18px"><span class="badge">${t("trialL").replace("#",n(dl()))}</span> <a href="#" style="color:var(--ac)" onclick="S.tab='subi';render();return false">${t("subi")}</a></div>`:"";

function cmMode(x){return x&&(x[9]==="f"||x[9]==="r")?x[9]:"p"}
function cmVal(x){const m=cmMode(x),v=x&&x[8]!=null&&x[8]!==""?cmNum(x[8]):NaN;if(m==="p")return isNaN(v)?40:Math.min(100,Math.max(0,Math.round(v*10)/10));return isNaN(v)?0:Math.max(0,Math.round(v))}
function cmShare(x,rev,days){const m=cmMode(x),v=cmVal(x);if(m==="p")return Math.round(rev*v/100);const a=Math.round(v*days/30);return m==="f"?a:rev-a}
function cmShareL(x,a,days){if(cmMode(x)!=="p")return cmShare(x,a.reduce((q,y)=>q+y.amt,0),days);const d=cmVal(x);return Math.round(a.reduce((q,y)=>q+y.amt*(y.cm!=null&&y.cm!==""&&!isNaN(+y.cm)?Math.min(100,Math.max(0,+y.cm)):d)/100,0))}

<script id="demo-layer">
(function(){

 try{
  S.lang=q.get("lang")||"fa";

  window.supBtn=function(){var b=$("spf");if(S.user!=="owner"){if(b)b.remove();return}
   if(!b){b=document.createElement("button");b.id="spf";b.className="btn";
    b.style.cssText="position:fixed;inset-inline-end:16px;bottom:16px;z-index:50;width:auto;padding:10px 18px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:default";
    document.body.append(b)}
   b.textContent=t("supBtn")};
  render();supBtn();
 }catch(e){console.error(e)}
 // only page navigation works; every choice, toggle, input and purchase action is locked
 function nav(el){
  var b=el&&el.closest&&el.closest("button,a");if(!b)return false;
  var o=b.getAttribute("onclick")||"";
  return /^S\.tab=/.test(o);
 }
 ["click","dblclick","mousedown","mouseup","submit","change","input","keydown","keyup","keypress","contextmenu","dragstart"].forEach(function(t){
  addEventListener(t,function(e){
   if(t==="click"&&nav(e.target))return;
   if(t==="mousedown"||t==="mouseup"||t==="keyup"){if(nav(e.target))return}
   e.preventDefault();e.stopImmediatePropagation();
  },true)});
 new MutationObserver(function(){document.querySelectorAll("input,textarea,select").forEach(function(el){el.readOnly=true;el.tabIndex=-1})}).observe(document.body,{childList:true,subtree:true});
})();
